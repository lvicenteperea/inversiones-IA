<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inversiones IA</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Inversiones IA</h1>
      <p>Simulador privado de carteras conservadoras</p>
    </div>
    <a class="button" href="/docs" target="_blank" rel="noreferrer">API Docs</a>
  </header>

  <main class="container">
    <section class="card hero">
      <div>
        <h2>Simulación inicial</h2>
        <p>Prueba una renta mensual y una rentabilidad estimada sin invertir dinero real.</p>
      </div>
      <a class="button secondary" href="/api/reports/demo.xlsx">Descargar Excel demo</a>
    </section>

    <section class="grid">
      <label class="field">Capital inicial
        <input id="initialAmount" type="number" min="1000" step="1000" value="300000">
      </label>
      <label class="field">Rentabilidad anual %
        <input id="annualReturn" type="number" step="0.1" value="3.5">
      </label>
      <label class="field">Renta mensual
        <input id="monthlyIncome" type="number" min="0" step="50" value="650">
      </label>
      <label class="field">Años
        <input id="years" type="number" min="1" max="50" step="1" value="20">
      </label>
      <label class="field">Inflación anual %
        <input id="inflation" type="number" min="0" step="0.1" value="2.5">
      </label>
    </section>

    <section class="actions">
      <button id="runSimulation" class="button" type="button">Simular</button>
      <span id="status" role="status"></span>
    </section>

    <section class="summary" aria-live="polite">
      <article class="metric"><span>Capital final nominal</span><strong id="finalNominal">-</strong></article>
      <article class="metric"><span>Capital final real</span><strong id="finalReal">-</strong></article>
      <article class="metric"><span>Renta total retirada</span><strong id="totalIncome">-</strong></article>
    </section>

    <section class="card">
      <h2>Evolución estimada</h2>
      <canvas id="chart" width="900" height="320" aria-label="Grafico de evolucion estimada"></canvas>
    </section>

    <section class="card">
      <h2>Carteras demo</h2>
      <div id="portfolios"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
